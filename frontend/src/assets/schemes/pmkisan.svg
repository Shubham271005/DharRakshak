<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="PM-KISAN illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7B3"/><stop offset="1" stop-color="#FFF6E0"/></linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FA65A"/><stop offset="1" stop-color="#2E6B3F"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6D365"/><stop offset="1" stop-color="#C9A227"/></linearGradient>
  </defs>
  <rect width="640" height="320" fill="url(#sky)"/>
  <circle cx="530" cy="80" r="46" fill="#FFC94D" opacity=".9"/>
  <path d="M0 210 Q160 170 320 205 T640 195 V320 H0Z" fill="url(#field)"/>
  <g stroke="#1F3D2B" stroke-width="3" opacity=".35">
    <path d="M40 320 L180 215"/><path d="M140 320 L240 212"/><path d="M260 320 L310 208"/><path d="M380 320 L370 207"/><path d="M500 320 L440 205"/><path d="M610 320 L510 200"/>
  </g>
  <!-- farmer -->
  <g transform="translate(120 120)">
    <circle cx="40" cy="22" r="18" fill="#8D5524"/>
    <path d="M14 18 Q40 -6 66 18 Z" fill="#F7F5EF"/>
    <path d="M18 44 Q40 34 62 44 L68 110 H12 Z" fill="#F7F5EF"/>
    <path d="M12 110 H68 L64 150 H16 Z" fill="#E8EFE0"/>
    <path d="M62 56 L96 40" stroke="#8D5524" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- phone with rupee transfer -->
  <g transform="translate(250 70)">
    <rect width="96" height="170" rx="14" fill="#1F3D2B"/>
    <rect x="8" y="14" width="80" height="140" rx="6" fill="#F7F5EF"/>
    <circle cx="48" cy="70" r="26" fill="url(#coin)"/>
    <text x="48" y="80" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1F3D2B">₹</text>
    <rect x="20" y="110" width="56" height="8" rx="4" fill="#7FA65A"/>
    <rect x="28" y="124" width="40" height="6" rx="3" fill="#C9D7BC"/>
  </g>
  <g fill="url(#coin)" stroke="#A8841C" stroke-width="2">
    <circle cx="380" cy="52" r="14"/><circle cx="408" cy="74" r="10"/><circle cx="370" cy="84" r="7"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="420" y="120" font-size="34" font-weight="800" fill="#1F3D2B">PM-KISAN</text>
    <text x="420" y="150" font-size="18" font-weight="600" fill="#1F3D2B">₹6,000 / year</text>
    <text x="420" y="172" font-size="14" fill="#2E6B3F">3 instalments of ₹2,000</text>
  </g>
</svg>
