<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="PMFBY crop insurance illustration">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FB8C9"/><stop offset="1" stop-color="#DCE8EE"/></linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9A227"/><stop offset="1" stop-color="#8A6E14"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E6B3F"/><stop offset="1" stop-color="#1F3D2B"/></linearGradient>
  </defs>
  <rect width="640" height="320" fill="url(#sky2)"/>
  <!-- cloud and rain -->
  <g fill="#6B8394">
    <circle cx="120" cy="70" r="30"/><circle cx="160" cy="58" r="38"/><circle cx="205" cy="72" r="28"/><rect x="95" y="70" width="135" height="30" rx="15"/>
  </g>
  <g stroke="#4A6B80" stroke-width="4" stroke-linecap="round">
    <path d="M115 112 l-8 18"/><path d="M145 112 l-8 18"/><path d="M175 112 l-8 18"/><path d="M205 112 l-8 18"/>
  </g>
  <path d="M0 220 Q200 190 360 215 T640 205 V320 H0Z" fill="url(#field2)"/>
  <!-- wheat stalks -->
  <g stroke="#6E5810" stroke-width="3" fill="#E8C547">
    <g transform="translate(60 160)"><path d="M10 80 V10"/><ellipse cx="10" cy="10" rx="6" ry="14"/></g>
    <g transform="translate(95 150)"><path d="M10 90 V10"/><ellipse cx="10" cy="10" rx="6" ry="14"/></g>
    <g transform="translate(130 165)"><path d="M10 75 V10"/><ellipse cx="10" cy="10" rx="6" ry="14"/></g>
    <g transform="translate(165 155)"><path d="M10 85 V10"/><ellipse cx="10" cy="10" rx="6" ry="14"/></g>
  </g>
  <!-- shield over the crop -->
  <g transform="translate(250 60)">
    <path d="M80 0 L160 30 V100 Q160 170 80 200 Q0 170 0 100 V30 Z" fill="url(#shield)"/>
    <path d="M80 18 L144 42 V100 Q144 155 80 182 Q16 155 16 100 V42 Z" fill="none" stroke="#7FA65A" stroke-width="4"/>
    <path d="M48 104 L72 128 L116 80" fill="none" stroke="#F7F5EF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="425" y="170" font-size="40" font-weight="800" fill="#1F3D2B">PMFBY</text>
    <text x="425" y="200" font-size="18" font-weight="600" fill="#1F3D2B">Crop insurance</text>
    <text x="425" y="224" font-size="12.5" fill="#1F3D2B">Premium: 2% Kharif · 1.5% Rabi</text>
  </g>
</svg>
